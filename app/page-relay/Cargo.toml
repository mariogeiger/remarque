[package]
name = "remarque-page-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json", "ws"] }
blake3 = "1.8"
constant_time_eq = "0.4"
futures-util = "0.3"
getrandom = "0.3"
postcard = { version = "1", features = ["alloc"] }
remarque-core = { path = "../core" }
remarque-page-log = { path = "../page-log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
