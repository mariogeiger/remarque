<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remarque Live</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #111312;
    }

    * { box-sizing: border-box; }

    html, body, main {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    main {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      background: white;
    }
  </style>
</head>
<body>
  <main id="viewer"><canvas id="screen"></canvas></main>
  <script>
    (() => {
      "use strict";

      const HEADER_SIZE = 28;
      const TILE_HEADER_SIZE = 16;
      const MAGIC = "RMKS";
      const VERSION = 3;
      const FULL_FRAME = 1;
      const DELTA_FRAME = 2;
      const VIEWER_REPLACED_CLOSE_CODE = 4000;
      const VIEWER_SESSION = "__REMARQUE_VIEWER_SESSION__";
      const VIEWER_GENERATION = __REMARQUE_VIEWER_GENERATION__;
      const canvas = document.querySelector("#screen");
      const context = canvas.getContext("2d", { alpha: false });
      const viewer = document.querySelector("#viewer");
      let socket;
      let reconnectTimer;

      function readMagic(bytes) {
        return String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
      }

      function setGeometry(width, height) {
        if (canvas.width === width && canvas.height === height) return;
        canvas.width = width;
        canvas.height = height;
        canvas.style.aspectRatio = `${width} / ${height}`;
      }

      function paintFull(bytes, width, height, stride) {
        setGeometry(width, height);
        const image = context.createImageData(width, height);
        for (let y = 0; y < height; y += 1) {
          let source = HEADER_SIZE + y * stride;
          let destination = y * width * 4;
          for (let x = 0; x < width; x += 1) {
            image.data[destination] = bytes[source + 2];
            image.data[destination + 1] = bytes[source + 1];
            image.data[destination + 2] = bytes[source];
            image.data[destination + 3] = 255;
            source += 4;
            destination += 4;
          }
        }
        context.putImageData(image, 0, 0);
      }

      function paintDelta(bytes, view, tileCount) {
        let cursor = HEADER_SIZE;
        for (let tile = 0; tile < tileCount; tile += 1) {
          if (cursor + TILE_HEADER_SIZE > bytes.length) throw new Error("Truncated tile header");
          const x = view.getUint32(cursor, true);
          const y = view.getUint32(cursor + 4, true);
          const width = view.getUint32(cursor + 8, true);
          const height = view.getUint32(cursor + 12, true);
          cursor += TILE_HEADER_SIZE;
          const pixelBytes = width * height * 4;
          if (cursor + pixelBytes > bytes.length) throw new Error("Truncated tile pixels");
          const image = context.createImageData(width, height);
          for (let source = cursor, destination = 0; source < cursor + pixelBytes; source += 4) {
            image.data[destination] = bytes[source + 2];
            image.data[destination + 1] = bytes[source + 1];
            image.data[destination + 2] = bytes[source];
            image.data[destination + 3] = 255;
            destination += 4;
          }
          context.putImageData(image, x, y);
          cursor += pixelBytes;
        }
        if (cursor !== bytes.length) throw new Error("Unexpected trailing tile data");
      }

      function paintMessage(event) {
        try {
          const bytes = new Uint8Array(event.data);
          if (bytes.length < HEADER_SIZE || readMagic(bytes) !== MAGIC) throw new Error("Invalid message");
          const view = new DataView(event.data);
          const version = view.getUint8(4);
          const messageType = view.getUint8(5);
          const payloadLength = view.getUint32(8, true);
          const tileCount = view.getUint32(12, true);
          const width = view.getUint32(16, true);
          const height = view.getUint32(20, true);
          const stride = view.getUint32(24, true);
          if (version !== VERSION) throw new Error("Unsupported protocol version");
          if (bytes.length !== HEADER_SIZE + payloadLength) throw new Error("Invalid payload size");
          if (messageType === FULL_FRAME) {
            if (payloadLength !== stride * height || stride < width * 4) throw new Error("Invalid frame geometry");
            paintFull(bytes, width, height, stride);
          } else if (messageType === DELTA_FRAME) {
            setGeometry(width, height);
            paintDelta(bytes, view, tileCount);
          } else {
            throw new Error("Unknown message type");
          }
        } catch (error) {
          console.error(error);
          socket?.close();
        }
      }

      function connect() {
        clearTimeout(reconnectTimer);
        const scheme = location.protocol === "https:" ? "wss" : "ws";
        socket = new WebSocket(
          `${scheme}://${location.host}/ws/3?session=${VIEWER_SESSION}&viewer=${VIEWER_GENERATION}`,
        );
        socket.binaryType = "arraybuffer";
        socket.addEventListener("message", paintMessage);
        socket.addEventListener("close", (event) => {
          if (event.code !== VIEWER_REPLACED_CLOSE_CODE) reconnectTimer = setTimeout(connect, 1200);
        });
        socket.addEventListener("error", () => socket.close());
      }

      document.addEventListener("keydown", async (event) => {
        if (!(event.metaKey && event.key.toLowerCase() === "f")) return;
        event.preventDefault();
        if (document.fullscreenElement) await document.exitFullscreen();
        else await viewer.requestFullscreen();
      });

      connect();
    })();
  </script>
</body>
</html>
